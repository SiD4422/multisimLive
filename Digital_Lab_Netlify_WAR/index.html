<!DOCTYPE html>
<html>
  <head>
  <link rel="manifest" href="/circuit/manifest.json">
  
    <!-- Properties can be specified to influence deferred binding -->
    <meta name='gwt:property' content='locale=en_UK'>
    
    
    <!-- Titles are optional, but useful -->
    <title>CircuitJS1 Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
    /* Premium Modern Styles */
    :root {
        /* Default is Dark theme variables */
        --bg-color: #0b0f19;
        --panel-bg: #0f172a;
        --border-color: #1e293b;
        --border-hover: #334155;
        --text-color: #f1f5f9;
        --text-muted: #94a3b8;
        --button-bg: #1e293b;
        --button-hover: #334155;
        --button-border: #334155;
        --active-color: #38bdf8;
        --active-bg: #1e293b;
    }

    body.theme-light {
        --bg-color: #f8fafc;
        --panel-bg: #f8fafc;
        --border-color: #e2e8f0;
        --border-hover: #cbd5e1;
        --text-color: #0f172a;
        --text-muted: #475569;
        --button-bg: #f1f5f9;
        --button-hover: #e2e8f0;
        --button-border: #cbd5e1;
        --active-color: #0284c7;
        --active-bg: #e2e8f0;
    }

    body.theme-dark {
        --bg-color: #0b0f19;
        --panel-bg: #0f172a;
        --border-color: #1e293b;
        --border-hover: #334155;
        --text-color: #f1f5f9;
        --text-muted: #94a3b8;
        --button-bg: #1e293b;
        --button-hover: #334155;
        --button-border: #334155;
        --active-color: #38bdf8;
        --active-bg: #1e293b;
    }

    body, td, th, select, input, textarea, button, .gwt-MenuItem, .gwt-Label, .gwt-Button, .topButton, .topButton-red {
        font-family: 'Outfit', sans-serif !important;
    }
    
    .gwt-Label {
        color: var(--text-color) !important;
    }
    
    body {
        background-color: var(--bg-color) !important;
        margin: 0;
        padding: 0;
        transition: background-color 0.2s ease;
    }

    .disabled {
        color: var(--text-muted) !important;
    }
    
    .topSpace {
        margin-top: 16px;
    }
    
    .cursorPointer {
        cursor: default;
    }
    
    .cursorCross {
        cursor: crosshair;
    }

    .cursorSplitter {
        cursor: row-resize;
    }

    .gwt-MenuItem-disabled {
        color: var(--text-muted) !important;
    }
    
    .offScreen {
        position: absolute;
        right: 101%;
        overflow: hidden;
    }
    
    .gwt-Frame {
        scrolling="no";
        border: 0px !important;
    }

    .gwt-MenuItem {
        font-size: 13px !important;
        font-weight: 400;
        padding: 6px 12px !important;
        border-radius: 4px;
        color: var(--text-color) !important;
        transition: background 0.15s ease;
    }
    
    .gwt-MenuItem-selected {
        background-color: var(--active-bg) !important;
        color: var(--active-color) !important;
    }

    .gwt-MenuBar-horizontal {
        font-size: 13px !important;
        background: var(--panel-bg) !important;
        border-bottom: 1px solid var(--border-color) !important;
        padding: 4px 8px !important;
        color: var(--text-color) !important;
    }

    .gwt-Label-selected {
        font-size: 1.3em;
        font-weight: 700;
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
        color: var(--active-color) !important;
    }
    
    .gwt-Label-1off {
        color: var(--text-muted);
    }

    .gwt-Label-2off {
        font-size: 0.8em;
        color: var(--text-muted);
    }

    .gwt-Button.chbut {
        padding: 6px 12px;
        margin: 4px;
        border-radius: 6px;
        border: 1px solid var(--button-border);
        background: var(--button-bg);
        color: var(--text-color);
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .gwt-Button.chbut:hover {
        background: var(--button-hover);
        border-color: var(--border-hover);
    }

    .gwt-Button.chbut.chsel {
        font-weight: 700;
        background: var(--active-color);
        color: var(--bg-color);
        border-color: var(--active-color);
    }

    .gwt-Button.chbut-black {
        background: var(--panel-bg);
        color: var(--text-color);
        border: 1px solid var(--border-color);
    }

    .gwt-Button.chbut-white {
        background: #f8fafc;
        color: #0f172a;
        border: 1px solid #cbd5e1;
    }

    .gwt-TextBox.scalebox {
        width: 100px;
        background: var(--button-bg);
        color: var(--text-color);
        border: 1px solid var(--button-border);
        border-radius: 4px;
        padding: 4px;
    }

    .gwt-Button.expand-but {
        line-height: 0;
        font-size: 13px;
        margin-right: 5px;
        border-radius: 4px;
        display: inline-block;
        text-align: center;
        width: 18px;
        height: 18px;
        padding: 0;
        margin-bottom: 1px;
        background: var(--button-bg);
        color: var(--text-color);
        border: none;
        cursor: pointer;
    }

    .topButton-red {
        margin: 2px 4px;
        padding: 6px 12px;
        text-decoration: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff !important;
        background-color: #ef4444; 
        border: 1px solid #dc2626;
        border-radius: 6px;
        transition: all 0.2s ease;
    }
    
    .topButton-red:hover {
        background-color: #dc2626;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }

    .topButton {
        margin: 2px 4px;
        padding: 6px 12px;
        text-decoration: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-color) !important;
        background-color: var(--button-bg); 
        border: 1px solid var(--button-border);
        border-radius: 6px;
        transition: all 0.2s ease;
    }
    
    .topButton:hover {
        background-color: var(--button-hover);
        border-color: var(--border-hover);
    }

    /* compact variant for side-pane buttons */
    .topButton.compact,
    .topButton-red.compact {
        font-size: 11px;
        padding: 4px 8px;
        margin: 2px 3px;
    }

    .radioPanel label {
        margin-right: 15px;
        color: var(--text-muted);
    }
    
    /* Modern Glassmorphic Toolbar wrapper */
    .modern-toolbar {
        background: var(--panel-bg) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid var(--border-color) !important;
        padding: 4px 8px !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15) !important;
        transition: all 0.2s ease;
    }
    
    .toolbar-icon-button {
        color: var(--text-muted) !important;
        padding: 2px 3px !important;
        margin-right: 2px !important;
        border-radius: 4px !important;
        transition: all 0.2s ease !important;
    }
    
    .toolbar-icon-button:hover {
        color: var(--active-color) !important;
        background-color: var(--active-bg) !important;
    }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
        background: var(--button-bg);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--button-hover);
    }

    /* GWT vertical dropdown menu bars */
    .gwt-MenuBar-vertical {
        font-size: 13px !important;
        background: var(--panel-bg) !important;
        border: 1px solid var(--border-color) !important;
        padding: 6px !important;
        color: var(--text-color) !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3) !important;
        border-radius: 8px !important;
    }
    
    .gwt-MenuBar-vertical .gwt-MenuItem {
        margin: 2px 0 !important;
    }

    /* GWT general popup panels */
    .gwt-PopupPanel {
        background: var(--panel-bg) !important;
        border: 1px solid var(--border-color) !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3) !important;
        border-radius: 8px !important;
        padding: 4px !important;
    }

    /* GWT DialogBox styling */
    .gwt-DialogBox {
        background: var(--panel-bg) !important;
        border: 1px solid var(--border-color) !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.4) !important;
        border-radius: 12px !important;
        font-family: 'Outfit', sans-serif !important;
        color: var(--text-color) !important;
        overflow: hidden;
    }
    
    .gwt-DialogBox table, 
    .gwt-DialogBox td {
        background: var(--panel-bg) !important;
    }
    
    .gwt-DialogBox .gwt-Label {
        color: var(--text-color) !important;
    }

    .gwt-DialogBox .Caption {
        background: var(--button-bg) !important;
        color: var(--text-color) !important;
        font-weight: 600 !important;
        padding: 10px 16px !important;
        border-bottom: 1px solid var(--border-color) !important;
        cursor: move;
    }

    /* Dialog box inner widgets */
    .gwt-DialogBox .gwt-TextBox, 
    .gwt-DialogBox .gwt-TextArea,
    .gwt-TextBox, 
    .gwt-TextArea {
        background-color: var(--button-bg) !important;
        color: var(--text-color) !important;
        border: 1px solid var(--button-border) !important;
        border-radius: 6px !important;
        padding: 6px 10px !important;
        font-size: 13px !important;
        transition: all 0.2s ease !important;
    }

    .gwt-DialogBox .gwt-TextBox:focus, 
    .gwt-DialogBox .gwt-TextArea:focus,
    .gwt-TextBox:focus, 
    .gwt-TextArea:focus {
        outline: none !important;
        border-color: var(--active-color) !important;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important;
    }

    .gwt-DialogBox .gwt-ListBox,
    .gwt-ListBox {
        background-color: var(--button-bg) !important;
        color: var(--text-color) !important;
        border: 1px solid var(--button-border) !important;
        border-radius: 6px !important;
        padding: 6px 10px !important;
        font-size: 13px !important;
        outline: none !important;
    }

    .gwt-DialogBox .gwt-Button,
    .gwt-Button {
        padding: 6px 16px !important;
        border-radius: 6px !important;
        border: 1px solid var(--button-border) !important;
        background: var(--button-bg) !important;
        color: var(--text-color) !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
    }

    .gwt-DialogBox .gwt-Button:hover,
    .gwt-Button:hover {
        background: var(--button-hover) !important;
        border-color: var(--border-hover) !important;
        color: var(--text-color) !important;
    }
    </style>

<link rel="stylesheet" href="font/fontello.css">

</head>
  <body class="theme-dark">
  <!-- Include the next line to allow support for dropbox import/export. You will need your own app key. -->
  <!--<script type="text/javascript" src="https://www.dropbox.com/static/api/2/dropins.js" id="dropboxjs" data-app-key="YOUR_KEY"></script>-->

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAwoELkKP2IIv18E8isKOAhnYh6-ng0nBE",
      authDomain: "circuit-simulator-cloud.firebaseapp.com",
      projectId: "circuit-simulator-cloud",
      storageBucket: "circuit-simulator-cloud.firebasestorage.app",
      messagingSenderId: "277291224498",
      appId: "1:277291224498:web:1b4b1e64059618179aa8ab",
      measurementId: "G-C65Q8F2DG1"
    };

    // Initialize Firebase if config is set
    var db = null;
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }

    // Exported function for GWT to save circuit
    window.saveCircuitToCloud = function(circuitData) {
      if (!db) {
        alert("Firebase is not configured! Please add your credentials in circuitjs.html");
        return;
      }
      var circuitName = prompt("Enter a name for this circuit:", "My Circuit");
      if (!circuitName) return;
      
      db.collection("circuits").add({
        name: circuitName,
        data: circuitData,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function(docRef) {
        alert("Circuit saved successfully to Cloud with ID: " + docRef.id);
      }).catch(function(error) {
        alert("Error saving circuit: " + error.message);
      });
    };

    // Exported function for GWT to load circuit
    window.loadCircuitFromCloud = function(callback) {
      if (!db) {
        alert("Firebase is not configured! Please add your credentials in circuitjs.html");
        return;
      }
      
      var circuitId = prompt("Enter the Cloud Circuit ID to load:");
      if (!circuitId) return;

      db.collection("circuits").doc(circuitId).get().then(function(doc) {
        if (doc.exists) {
            var data = doc.data().data;
            // Execute the GWT callback
            callback(data);
        } else {
            alert("No circuit found with that ID!");
        }
      }).catch(function(error) {
        alert("Error loading circuit: " + error.message);
      });
    };

    // Exported function for GWT to save Custom IC to Cloud
    window.saveICToCloud = function(icName, icData) {
      if (!db) return;
      db.collection("custom_ics").doc(icName).set({
        name: icName,
        data: icData,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        console.log("Custom IC saved to Cloud: " + icName);
      }).catch(function(error) {
        console.error("Error saving Custom IC: " + error.message);
      });
    };

    // Exported function for GWT to load all Custom ICs from Cloud
    window.loadICsFromCloud = function(callback) {
      if (!db) return;
      db.collection("custom_ics").get().then(function(querySnapshot) {
        var ics = [];
        querySnapshot.forEach(function(doc) {
            ics.push(doc.data());
        });
        callback(JSON.stringify(ics));
      }).catch(function(error) {
        console.error("Error loading Custom ICs: " + error.message);
      });
    };

    // Phase 3: Export Canvas as PDF
    window.exportCanvasAsPDF = function() {
        if (typeof window.jspdf === 'undefined') {
            alert("jsPDF library not loaded yet.");
            return;
        }
        var canvas = document.querySelector('canvas');
        if (!canvas) {
            alert("Simulation canvas not found.");
            return;
        }
        var pdf = new window.jspdf.jsPDF('landscape', 'pt', [canvas.width, canvas.height]);
        var imgData = canvas.toDataURL('image/jpeg', 1.0);
        pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
        pdf.save('circuit-export.pdf');
    };

    // Phase 3: Copy Shareable Link
    window.copyCloudLinkToClipboard = function(circuitData) {
        if (!db) {
            alert("Firebase is not configured.");
            return;
        }
        db.collection("circuits").add({
            name: "Shared Circuit",
            data: circuitData,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(docRef) {
            var url = window.location.origin + window.location.pathname + "?cloudid=" + docRef.id;
            navigator.clipboard.writeText(url).then(function() {
                alert("Shareable link copied to clipboard!\n\n" + url);
            }).catch(function(err) {
                alert("Failed to copy link. Here it is:\n" + url);
            });
        }).catch(function(error) {
            alert("Error generating share link: " + error.message);
        });
    };

    // Phase 3: Load Circuit from URL cloudid on startup
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const cloudId = urlParams.get('cloudid');
        if (cloudId && db) {
            db.collection("circuits").doc(cloudId).get().then(function(doc) {
                if (doc.exists) {
                    var data = doc.data().data;
                    var interval = setInterval(function() {
                        if (window.loadCircuitDataStr) {
                            window.loadCircuitDataStr(data);
                            clearInterval(interval);
                        }
                    }, 200);
                } else {
                    alert("No circuit found with ID: " + cloudId);
                }
            });
        }
    });
  </script>

  <script language="javascript" src="lz-string.min.js"></script>
   
    <!-- This script tag is what actually loads the GWT module.  The -->
    <!-- 'nocache.js' file (also called a "selection script") is     -->

    <script language="javascript" src="circuitjs1/circuitjs1.nocache.js"></script>

    <!-- (the id must be exactly as shown)                           -->
    <iframe src="javascript:''" id="__gwt_historyFrame" style="width:0;height:0;border:0"></iframe>
    
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
	navigator.serviceWorker.register('service-worker.js').then(registration => {
	  console.log('Service Worker registered with scope:', registration.scope);
	}).catch(error => {
	  console.error('Service Worker registration failed:', error);
	});
      });
    }
    </script>

  </body>
